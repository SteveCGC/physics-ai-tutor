<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Atom orbitals: 3 flat ellipses at 0° / 60° / -60° -->
  <g fill="none" stroke="white" stroke-width="18" opacity="0.80">
    <ellipse cx="256" cy="256" rx="215" ry="76"/>
    <ellipse cx="256" cy="256" rx="215" ry="76" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="215" ry="76" transform="rotate(-60 256 256)"/>
  </g>

  <!-- Center nucleus -->
  <circle cx="256" cy="256" r="72" fill="#4C1D95" opacity="0.72"/>

  <!-- "AI" text -->
  <text x="256" y="282"
    text-anchor="middle"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="88" font-weight="900"
    fill="white" letter-spacing="-2">AI</text>

  <!-- Graduation cap (mortarboard diamond + tassel) -->
  <polygon points="256,114  192,150  256,178  320,150" fill="white" opacity="0.93"/>
  <line x1="320" y1="150" x2="334" y2="184"
    stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.90"/>
  <circle cx="334" cy="196" r="13" fill="white" opacity="0.90"/>
</svg>
