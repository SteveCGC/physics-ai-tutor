<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-px bg-gradient-to-r from-transparent via-white/40 to-transparent rotate-45"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-px bg-gradient-to-r from-transparent via-white/40 to-transparent -rotate-45"></div>

<div class="relative z-10">

<span>加入超过 50,000+ 物理爱好者的行列</span>

<!-- Abstract Physics Illustration -->
<div class="absolute bottom-0 right-0 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[300px]">blur_on</span>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-white dark:bg-slate-900">
<div class="mb-10">
<h3 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">欢迎回来</h3>
<p class="text-slate-500 dark:text-slate-400">请登录您的 PhysicsAI 账号</p>
</div>
<!-- Role Tabs -->
<div class="flex border-b border-border-light dark:border-slate-800 mb-8">
<button class="px-8 py-3 text-sm font-bold border-b-2 border-primary text-primary transition-colors">
                    学生登录
                </button>
<button class="px-8 py-3 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    教师登录
                </button>
</div>
<!-- Form -->
<form action="#" class="space-y-6">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">用户名 / 邮箱</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-border-light dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white" placeholder="请输入您的用户名或邮箱" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-11 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-border-light dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white" placeholder="请输入您的密码" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded text-primary focus:ring-primary border-border-light dark:border-slate-700 dark:bg-slate-800" type="checkbox"/>
<span class="text-sm text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-300 transition-colors">记住我</span>
</label>
<a class="text-sm font-medium text-primary hover:underline" href="#">忘记密码？</a>
</div>
<button class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98]" type="submit">
                    立即登录
                </button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-light dark:border-slate-800"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-white dark:bg-slate-900 text-slate-400">使用其他方式登录</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 px-4 py-3 border border-border-light dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">

<svg class="w-5 h-5 text-primary" fill="currentColor" viewbox="0 0 24 24">
<path d="M2 12C2 6.48 6.48 2 12 2C17.52 2 22 6.48 22 12C22 17.52 17.52 22 12 22C6.48 22 2 17.52 2 12ZM12 4C7.58 4 4 7.58 4 12C4 16.42 7.58 20 12 20C16.42 20 20 16.42 20 12C20 7.58 16.42 4 12 4Z"></path>

<p class="mt-10 text-center text-sm text-slate-500">

</div>
</div>
