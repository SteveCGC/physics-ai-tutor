<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注册 - 物理AI助手</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#891fe5",
                        "background-light": "#f7f6f8",
                        "background-dark": "#1a1121",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "Noto Sans SC", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
        }
        .physics-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(137, 31, 229, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-0 md:p-4">
<div class="flex flex-col md:flex-row w-full max-w-[1200px] min-h-[800px] bg-white dark:bg-slate-900 rounded-none md:rounded-xl overflow-hidden shadow-2xl">
<!-- Left Side: Physics Theme Graphics -->
<div class="hidden md:flex md:w-5/12 bg-primary relative overflow-hidden flex-col justify-between p-12 text-white">
<!-- Abstract background elements -->
<div class="absolute inset-0 opacity-20">
<div class="absolute top-10 left-10 w-32 h-32 border-2 border-white rounded-full"></div>
<div class="absolute bottom-20 right-10 w-64 h-64 border border-white/30 rounded-full"></div>
<div class="absolute top-1/2 left-1/4 w-48 h-48 border-t-2 border-l-2 border-white/40 rounded-tl-3xl rotate-45"></div>
<div class="absolute top-1/3 right-1/4">
<span class="text-4xl font-serif opacity-50 italic">E = mc²</span>
</div>
<div class="absolute bottom-1/4 left-10">
<span class="text-2xl font-serif opacity-30 italic">F = ma</span>
</div>
</div>
<div class="relative z-10">
<div class="flex items-center gap-3 mb-12">
<div class="size-10 bg-white text-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">architecture</span>
</div>
<h1 class="text-2xl font-bold tracking-tight">物理AI助手</h1>
</div>
<div class="space-y-6">
<h2 class="text-4xl lg:text-5xl font-bold leading-tight">探索物理的<br/>无限可能</h2>
<p class="text-white/80 text-lg max-w-xs">
                        利用人工智能的力量，让复杂的物理概念变得简单易懂。
                    </p>
</div>
</div>
<div class="relative z-10">
<div class="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20">
<p class="text-sm italic opacity-90 leading-relaxed">
                        "在这里，每一个公式都不再是冰冷的字符，而是通往宇宙奥秘的钥匙。"
                    </p>
</div>
</div>
<!-- Graphic Image Placeholder -->
<div class="absolute bottom-0 right-0 w-full h-full opacity-10 pointer-events-none" data-alt="Abstract physics formulas and geometric wave patterns">
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-7/12 p-6 md:p-16 flex flex-col justify-center bg-white dark:bg-slate-900">
<div class="max-w-md mx-auto w-full">
<header class="mb-8">
<h3 class="text-3xl font-bold text-slate-900 dark:text-slate-100 mb-2">创建您的账号</h3>
<p class="text-slate-500 dark:text-slate-400">开启您的科学探索之旅</p>
</header>
<!-- Role Selection Tabs -->
<div class="flex border-b border-slate-200 dark:border-slate-700 mb-8">
<button class="flex-1 py-4 text-center border-b-2 border-primary text-primary font-bold transition-colors">
                        学生注册
                    </button>
<button class="flex-1 py-4 text-center border-b-2 border-transparent text-slate-500 dark:text-slate-400 font-bold hover:text-primary transition-colors">
                        教师注册
                    </button>
</div>
<!-- Form Fields -->
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">姓名</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-slate-100" placeholder="请输入您的真实姓名" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">手机号/邮箱</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">alternate_email</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-slate-100" placeholder="手机号或电子邮箱" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">验证码</label>
<div class="flex gap-3">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">verified_user</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-slate-100" placeholder="6位验证码" type="text"/>
</div>
<button class="px-4 py-3 bg-primary/10 text-primary font-semibold rounded-lg hover:bg-primary/20 transition-colors whitespace-nowrap min-w-[120px]" type="button">
                                获取验证码
                            </button>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">设置密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-slate-100" placeholder="至少8位字符" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">确认密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock_reset</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-slate-100" placeholder="请再次输入密码" type="password"/>
</div>
</div>
<div class="flex items-start gap-2 py-2">
<input class="mt-1 size-4 rounded border-slate-300 text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed" for="terms">
                            我已阅读并同意 <a class="text-primary hover:underline" href="#">服务协议</a> 和 <a class="text-primary hover:underline" href="#">隐私政策</a>
</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0" type="submit">
                        立即注册
                    </button>
</form>
<footer class="mt-8 text-center">
<p class="text-slate-600 dark:text-slate-400">
                        已有账号？ 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">立即登录</a>
</p>
</footer>
</div>
</div>
</div>
</body></html>
